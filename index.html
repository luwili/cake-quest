<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8ec">
    <meta name="description" content="Сказочный интерактивный квест для детей: соберите секретный рецепт торта для мамы.">
    <title>Cake Quest</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-glow page-glow-left" aria-hidden="true"></div>
    <div class="page-glow page-glow-right" aria-hidden="true"></div>
    <div class="site-wrap">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Cake Quest — начало квеста">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44">
              <path d="M9 33h26v5H9zM12 27h20v6H12zM16 19h12v8H16z" fill="#db7581"/>
              <path d="M13 24c2-3 4-3 6 0s4 3 6 0 4-3 6 0" fill="none" stroke="#fff8ec" stroke-linecap="round" stroke-width="2"/>
              <path d="M22 7c-4 4-4 7 0 9 4-2 4-5 0-9z" fill="#78a971"/>
              <circle cx="22" cy="18" r="2.2" fill="#f2bd5c"/>
              <path d="M8 39h28" stroke="#385747" stroke-linecap="round" stroke-width="2"/>
            </svg>
          </span>
          <span><strong>Cake Quest</strong><small>для мамы</small></span>
        </a>
        <div class="topbar-tools">
          <div class="progress-copy"><span id="progress-label">Ингредиенты в корзине</span><strong id="progress-count">0 из 5</strong></div>
          <button class="reset-button" type="button" data-action="reset">Начать заново</button>
        </div>
      </header>
      <div class="progress-track" role="progressbar" aria-label="Собранные ингредиенты" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress-bar">
        <span id="progress-fill"></span>
      </div>
      <main id="game" class="game" tabindex="-1"></main>
      <footer class="page-footer"><span>Сказочный квест для тёплого семейного праздника</span><span aria-hidden="true">✦</span></footer>
    </div>
  </body>
</html>
